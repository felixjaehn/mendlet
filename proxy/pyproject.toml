[project]
name = "repair-assistant-proxy"
version = "0.1.0"
description = "FastAPI proxy for the Reparatur-Assistent (Meta Model API: Muse Spark, SAM 3.1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "openai>=1.40",
    "httpx>=0.27",
    "pillow>=10.4",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "meta-sam-parser>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # long lines: i18n tables and prompts contain long strings
    "SIM105", # contextlib.suppress is not always clearer
    "B008",   # FastAPI Depends/File defaults in signatures
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
