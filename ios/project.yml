name: RepairAssistant
options:
  bundleIdPrefix: dev.felix
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_LANGUAGE: de
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  RepairAssistant:
    type: application
    platform: iOS
    sources:
      - path: RepairAssistant
    info:
      path: RepairAssistant/Info.plist
      properties:
        CFBundleDisplayName: Reparatur-Assistent
        CFBundleDevelopmentRegion: de
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Die Kamera wird genutzt, um ein Foto des defekten Gegenstands aufzunehmen."
        NSMicrophoneUsageDescription: "Das Mikrofon wird genutzt, um den Schaden per Sprache zu beschreiben."
        NSPhotoLibraryUsageDescription: "Der Zugriff auf deine Fotos erlaubt dir, ein vorhandenes Bild des Schadens auszuwählen."
        NSLocalNetworkUsageDescription: "Die App verbindet sich mit dem Analyse-Server in deinem lokalen Netzwerk."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        PROXY_BASE_URL: $(PROXY_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.felix.RepairAssistant
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RepairAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RepairAssistantTests
    dependencies:
      - target: RepairAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.felix.RepairAssistantTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RepairAssistant:
    build:
      targets:
        RepairAssistant: all
    test:
      targets:
        - RepairAssistantTests
