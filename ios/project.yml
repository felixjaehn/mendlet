name: RepairAssistant
options:
  bundleIdPrefix: dev.felix
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_LANGUAGE: de
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  RepairAssistant:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: RepairAssistant
        excludes:
          - Resources/LiveRecordings
      - path: RepairAssistant/Resources/LiveRecordings
        type: folder
    info:
      path: RepairAssistant/Info.plist
      properties:
        CFBundleDisplayName: Mendlet
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Mendlet uses the camera to find the damage and guide each repair step on your item."
        NSMicrophoneUsageDescription: "Describe the damage or ask for help by voice."
        NSPhotoLibraryUsageDescription: "Pick an existing photo of the damage."
        NSLocalNetworkUsageDescription: "Mendlet connects to its analysis server on your local network."
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        PROXY_BASE_URL: $(PROXY_BASE_URL)
    dependencies:
      - target: RepairWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.felix.RepairAssistant
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RepairWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RepairWidgets
      - path: Shared
    info:
      path: RepairWidgets/Info.plist
      properties:
        CFBundleDisplayName: Mendlet
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.felix.RepairAssistant.Widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RepairAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RepairAssistantTests
      - path: ../ios/RepairAssistant/Localizable.xcstrings
        buildPhase:
          copyFiles: {destination: resources, subpath: catalogs}
      - path: ../ios/RepairAssistant/InfoPlist.xcstrings
        buildPhase:
          copyFiles: {destination: resources, subpath: catalogs}
    dependencies:
      - target: RepairAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.felix.RepairAssistantTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RepairAssistant:
    build:
      targets:
        RepairAssistant: all
    test:
      targets:
        - RepairAssistantTests
