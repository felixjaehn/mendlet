name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proxy:
    name: Proxy tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Tests (offline, no API key; real network calls are blocked)
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
